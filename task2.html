        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="form-card">
                    <h3 class="mb-4">Task 2: Bootstrap Form Styling</h3>
                    <form>
                        <div class="mb-3">
                            <label for="bs-name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="bs-name" placeholder="John Doe">
                        </div>
                        <div class="mb-3">
                            <label for="bs-email" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="bs-email" placeholder="name@example.com">
                        </div>
                        <div class="mb-3">
                            <label for="bs-message" class="form-label">Message</label>
                            <textarea class="form-control" id="bs-message" rows="4" placeholder="Your message..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Submit Message</button>
                    </form>
                </div>
            </div>
        </div>
