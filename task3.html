<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 4 - Task 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">Assignment #4</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="task1.html">Task 1</a></li>
                    <li class="nav-item"><a class="nav-link" href="task2.html">Task 2</a></li>
                    <li class="nav-item"><a class="nav-link active" href="task3.html">Task 3</a></li>
                    <li class="nav-item"><a class="nav-link" href="task4.html">Task 4</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="form-card">
                    <h3 class="mb-4">Task 3: Bootstrap Validation</h3>
                    <form class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label for="val-name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="val-name" required>
                            <div class="valid-feedback">Looks good!</div>
                            <div class="invalid-feedback">Name is required.</div>
                        </div>
                        <div class="mb-3">
                            <label for="val-email" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="val-email" required>
                            <div class="valid-feedback">Looks good!</div>
                            <div class="invalid-feedback">Please provide a valid email.</div>
                        </div>
                        <div class="mb-3">
                            <label for="val-message" class="form-label">Message</label>
                            <textarea class="form-control" id="val-message" rows="4" required></textarea>
                            <div class="invalid-feedback">Message cannot be empty.</div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Submit Message</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
        (() => {
            'use strict'
            const forms = document.querySelectorAll('.needs-validation')
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>
</html>
